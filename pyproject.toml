[tool.poetry]
name = "library-management-system"
version = "0.1.0"
description = "REST API для управления библиотекой на Django REST Framework"
authors = ["Aigul Shinshalieva"]
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.11"
django = "^4.2"
djangorestframework = "^3.14.0"
djangorestframework-simplejwt = "^5.3.0"
django-filter = "^23.2"
drf-yasg = "^1.21.7"
psycopg2-binary = "^2.9.9"
gunicorn = "^21.2.0"
python-dotenv = "^1.0.0"

[build-system]
requires = ["poetry.core>=1.0.0"]
build-backend = "poetry.core.masonry.api"